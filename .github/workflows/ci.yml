name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Test & Lint (Python 3.11 & 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: recoverai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd recoverai/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/recoverai_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/recoverai_test
          ENVIRONMENT: test
        run: |
          cd recoverai/backend
          pytest -v

      - name: Run ML Pipeline Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/recoverai_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/recoverai_test
          ENVIRONMENT: test
        run: |
          cd recoverai/backend
          PYTHONPATH="../ml:." pytest ../ml/tests -v

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: recoverai/frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd recoverai/frontend
          npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
          NEXT_PUBLIC_MERCHANT_ID: aaaaaaaa-0000-4000-8000-aaaaaaaaaaaa
        run: |
          cd recoverai/frontend
          npm run build
