services:
  postgres:
    image: postgres:15-alpine
    container_name: recoverai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-recoverai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoverai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./recoverai/backend
      dockerfile: Dockerfile
    container_name: recoverai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/recoverai
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/recoverai_test
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/seed_demo.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./recoverai/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
        NEXT_PUBLIC_MERCHANT_ID: aaaaaaaa-0000-4000-8000-aaaaaaaaaaaa
    container_name: recoverai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

volumes:
  postgres_data:
    driver: local
